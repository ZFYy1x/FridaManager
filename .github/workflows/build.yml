name: Build FridaManager (roothide)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Default (and only) build target: Dopamine roothide (iphoneos-arm64).
  # Built on Linux the same way as the other roothide plugins: roothide/theos
  # install-theos fetches the patched SDK (which includes the private framework
  # stubs such as Preferences.tbd), so no Xcode / private-framework headaches.
  build-roothide:
    name: Build (Dopamine roothide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev debhelper fakeroot \
            clang lld make git perl curl

      - name: Install roothide/theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build (roothide)
        run: |
          cp control.roothide control
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Stage artifact
        run: |
          mkdir -p out
          mv packages/*.deb out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: fridamanager-roothide
          path: out/*.deb

  # Release only when a tag like v1.0.1 is pushed.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-roothide]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fridamanager-roothide
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.deb
          generate_release_notes: true
